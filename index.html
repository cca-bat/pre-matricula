/* ====================================================================== */
/* 8. Impressão (pede a planilha na versão 8): tiras do checklist, lista   */
/*    de pendências, lembretes e tiras em branco; "o que falta" na tela    */
/* ====================================================================== */
const MODOS = [['tiras', 'Tiras do checklist'], ['pendencias', 'Lista de pendências'], ['lembretes', 'Lembretes em branco'], ['brancas', 'Tiras em branco'], ['balanco', 'Balanço de vagas'], ['publicar', 'Para publicar']];
const GRUPOS_DE_TIRAS = [['nova', 'Novas'], ['mudou', 'Mudaram desde a última impressão'], ['igual', 'Já impressas'], ['indeferida', 'Indeferidas (só entram se você marcar)']];
const imp = { modo: 'tiras', escolhidos: {}, pendencias: false, filtro: '', impressos: null, enviando: false, erro: '', lembretes: 6, brancas: null };
const impPecas = {};

function minuscula(t) { return t.length > 1 && t.charAt(1) === t.charAt(1).toLowerCase() ? t.charAt(0).toLowerCase() + t.slice(1) : t; }
function semProvisorio(t) { return t.replace(/\s*\(provis[óo]rio\)\s*$/i, ''); }
function doisDigitos(n) { return ('0' + n).slice(-2); }
function hoje() {
  const d = new Date();
  return doisDigitos(d.getDate()) + '/' + doisDigitos(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + doisDigitos(d.getHours()) + ':' + doisDigitos(d.getMinutes());
}
function cotaNaTira(cota) { return cota === 'AC' ? 'Ampla' : cota; }
/** Nas tiras em branco, documentos do tipo "basta um": 'moldura' (um quadradinho para cada, dentro de uma moldura) ou 'linha' (uma linha só, com "ou"). */
const GRUPO_NA_TIRA_EM_BRANCO = 'moldura';
/** Valores de "Vale para" (aba Regras) que separam as pessoas de uma mesma cota por grupo étnico-racial. */
const ETNIAS = ['Pretos e pardos', 'Indígenas'];
function ehEtnia(vale) { return ETNIAS.some(function (e) { return Logica.chave(e) === Logica.chave(vale); }); }
/**
 * Modelos de tira em branco: um por cota. A cota que tem documentos só de pretos e pardos e outros só de indígenas ganha
 * um modelo para cada grupo, para ninguém ficar com quadradinhos vazios de documentos que não são os seus.
 */
function modelosEmBranco(cfg) {
  const modelos = [];
  cfg.cotas.forEach(function (cota) {
    const grupos = ETNIAS.filter(function (e) {
      return cfg.regras.some(function (r) { return (r.cotas || []).indexOf(cota) >= 0 && Logica.chave(r.vale) === Logica.chave(e); });
    });
    if (grupos.length > 1) grupos.forEach(function (e, n) { modelos.push({ chave: cota + '|' + e, cota: cota, etnia: e, rotulo: cota + ', ' + minuscula(e), principal: n === 0 }); });
    else modelos.push({ chave: cota, cota: cota, etnia: '', rotulo: cota, principal: true });
  });
  return modelos;
}

/** Rótulo do filtro de quem não é aprovado: em geral são só os classificáveis. */
function rotuloDeFora(lista) {
  return lista.some(function (v) { return Logica.chave(v.lista) !== 'classificavel'; }) ? 'Classificáveis e fora da lista' : 'Classificáveis';
}
function rotuloDaCota(cota) { return cota === 'AC' ? 'Ampla concorrência' : (cota ? 'Cota ' + cota : ''); }
function doProcesso(cfg) {
  return ['IFCE' + (cfg.campus ? ' campus ' + cfg.campus : ''), cfg.edital ? 'Edital ' + cfg.edital : ''].join(cfg.edital ? ' · ' : '');
}
/** Ordem das pastas físicas: por curso (na ordem da aba Config) e, dentro dele, por nome. */
function porCursoENome(cfg) {
  const cursos = cfg.cursos.map(function (c) { return c.nome; });
  const pos = function (c) { const i = cursos.indexOf(c); return i < 0 ? 999 : i; };
  return function (a, b) { return (pos(a.curso) - pos(b.curso)) || a.curso.localeCompare(b.curso, 'pt-BR') || a.nome.localeCompare(b.nome, 'pt-BR'); };
}

/**
 * Linhas da tira de uma pessoa: [{ texto, marcado, nota }]. Segue a ficha: só os documentos que valem para ela, na
 * ordem da aba Regras. Grupo "basta um" vira uma linha (o que foi entregue; se nada, o nome do grupo). Provisório só
 * aparece se foi entregue, logo abaixo do documento que ele cobre.
 */
function linhasDaTira(cfg, v) {
  const regras = Logica.regrasDe(cfg, v.docs);
  const vale = {};
  regras.forEach(function (r) { vale[r.codigo] = r; });
  const provisorio = {}, abaixoDe = {};
  regras.forEach(function (r) {
    const cobertos = r.cobre.filter(function (c) { return vale[c]; });
    if (!cobertos.length) return;
    provisorio[r.codigo] = true;
    let ultimo = '';
    regras.forEach(function (x) { if (cobertos.indexOf(x.codigo) >= 0) ultimo = x.codigo; });
    (abaixoDe[ultimo] = abaixoDe[ultimo] || []).push(r);
  });
  const grupos = {};
  regras.forEach(function (r) { if (r.grupo && !provisorio[r.codigo]) (grupos[r.grupo] = grupos[r.grupo] || []).push(r); });
  const falta = 'Falta' + (cfg.prazoPend ? ', prazo até ' + cfg.prazoPend : '');
  const depois = cfg.prazoDepois ? 'Entregar até ' + cfg.prazoDepois : 'Entregar depois';
  const linhas = [], vistos = {};
  regras.forEach(function (r) {
    if (provisorio[r.codigo]) return;
    const g = r.grupo ? grupos[r.grupo] : null;
    if (g && g.length > 1) {
      if (!vistos[r.grupo]) {
        vistos[r.grupo] = true;
        const entregues = g.filter(function (x) { return v.docs[x.codigo]; });
        if (entregues.length) {
          entregues.forEach(function (x) { linhas.push({ texto: x.documento, marcado: true, nota: '' }); });
        } else {
          const coberto = g.some(function (x) { return v.cobertos[x.codigo]; }), conta = g.some(function (x) { return x.conta; });
          linhas.push({ texto: r.grupo + ': ' + g.map(function (x) { return minuscula(x.documento); }).join(' ou '), marcado: false, nota: coberto ? depois : (conta ? falta : '') });
        }
      }
    } else {
      const marcado = !!v.docs[r.codigo];
      linhas.push({ texto: r.documento, marcado: marcado, nota: marcado ? '' : (v.cobertos[r.codigo] ? depois : (r.conta ? falta : '')) });
    }
    (abaixoDe[r.codigo] || []).forEach(function (p) {
      if (v.docs[p.codigo]) linhas.push({ texto: semProvisorio(p.documento), marcado: true, nota: 'Provisório' });
    });
  });
  return linhas;
}

/**
 * Linhas de uma tira em branco: os documentos da cota, para marcar à mão, com a condição de cada um ao lado. Os
 * provisórios não ganham linha (quem trouxe tudo ficaria com um quadrado vazio): o documento que aceita provisório
 * leva um quadradinho "provisório" no fim da linha.
 */
function linhasEmBranco(cfg, cota, etnia) {
  const daCota = cfg.regras.filter(function (r) {
    return (r.cotas || []).indexOf(cota) >= 0 && !(etnia && ehEtnia(r.vale) && Logica.chave(r.vale) !== Logica.chave(etnia));
  });
  const codigos = {};
  daCota.forEach(function (r) { codigos[r.codigo] = true; });
  const ehProvisorio = function (r) { return r.cobre.some(function (c) { return codigos[c]; }); };
  const aceita = {};
  daCota.forEach(function (r) { if (ehProvisorio(r)) r.cobre.forEach(function (c) { aceita[c] = true; }); });
  const QUANTOS = { 2: 'dos dois', 3: 'dos três', 4: 'dos quatro' };
  const linhas = [], vistos = {};
  const notaDe = function (r) { return r.vale && Logica.chave(r.vale) !== 'todos' && !(etnia && ehEtnia(r.vale)) ? minuscula(r.vale) : ''; };
  const linha = function (r) { return { texto: r.documento, marcado: false, nota: '', lado: notaDe(r), provisorio: !!aceita[r.codigo] }; };
  daCota.filter(function (r) { return !ehProvisorio(r); }).forEach(function (r) {
    const g = r.grupo ? daCota.filter(function (x) { return x.grupo === r.grupo && !ehProvisorio(x); }) : [];
    if (g.length < 2) { linhas.push(linha(r)); return; }
    if (vistos[r.grupo]) return;
    vistos[r.grupo] = true;
    const lado = notaDe(r);
    if (GRUPO_NA_TIRA_EM_BRANCO === 'linha') {
      linhas.push({ texto: g.map(function (x, n) { return n ? minuscula(x.documento) : x.documento; }).join(' ou '), marcado: false, nota: '', lado: lado, provisorio: false });
    } else {
      linhas.push({ titulo: 'Basta um ' + (QUANTOS[g.length] || 'do grupo') + (lado ? ' (' + lado + ')' : '') + ':',
        grupo: g.map(function (x) { return { texto: x.documento, marcado: false, nota: '', lado: '', provisorio: !!aceita[x.codigo] }; }) });
    }
  });
  return linhas;
}

function elLinhas(linhas) {
  return el('ul', {}, linhas.map(function (l) {
    // documentos do tipo "basta um": moldura com o aviso em cima e um quadradinho para cada documento
    if (l.grupo) return el('li', { class: 'basta' }, el('em', { text: l.titulo }), elLinhas(l.grupo));
    return el('li', {}, el('span', { class: 'cx' + (l.marcado ? ' sim' : '') }),
      el('span', {}, l.texto, l.lado ? [' ', el('em', { text: '(' + l.lado + ')' })] : null, l.nota ? el('small', { text: l.nota }) : null),
      l.provisorio ? el('span', { class: 'prov' }, el('span', { class: 'cx' }), 'provisório') : null);
  }));
}
/** Uma tira. "curso" e "nome" nulos fazem a tira em branco, com os dois para preencher à mão. */
function elTira(cfg, cota, curso, nome, data, linhas) {
  const modalidade = cfg.modalidade || '';
  const doCurso = curso === null
    ? el('span', {}, modalidade ? modalidade + ' em ' : 'Curso: ', el('span', { class: 'risco' }))
    : el('span', { text: modalidade && curso ? modalidade + ' em ' + curso : (curso || modalidade) });
  return el('div', { class: 'tira' },
    el('div', { class: 't1' }, el('span', { text: 'Documentação para pré-matrícula' }), el('span', { text: data })),
    el('div', { class: 't2' }, doCurso, el('span', { text: cotaNaTira(cota) })),
    el('div', { class: 'nome' + (nome === null ? ' em-branco' : ''), text: nome === null ? 'Candidato(a):' : nome }),
    elLinhas(linhas));
}
/** Duas por linha, cada par com a mesma altura, para o corte ser reto. Um par nunca é dividido entre páginas. */
function emPares(itens) {
  const pares = [];
  for (let i = 0; i < itens.length; i += 2) pares.push(el('div', { class: 'par' }, itens[i], itens[i + 1] || el('div', { class: 'fantasma' })));
  return pares;
}

/* ---------- lembrete em papel (marcado à mão) e lista de pendências */
function dadosDoLembrete(cfg) {
  const usados = {};
  Object.keys(estado.candidatos).forEach(function (i) { Object.keys(estado.candidatos[i].docs).forEach(function (k) { usados[k] = true; }); });
  const regras = cfg.regras.filter(function (r) { return usados[r.codigo]; });     // só o que vale para alguém da planilha
  const vale = {};
  regras.forEach(function (r) { vale[r.codigo] = r; });
  const ehProvisorio = function (r) { return r.cobre.some(function (c) { return vale[c]; }); };
  const definitivo = {};
  regras.forEach(function (r) { r.cobre.forEach(function (c) { if (vale[c]) definitivo[c] = true; }); });
  const agora = [], vistos = {};
  regras.forEach(function (r) {
    if (ehProvisorio(r)) return;
    if (r.grupo) {
      if (vistos[r.grupo]) return;
      vistos[r.grupo] = true;
      const membros = regras.filter(function (x) { return x.grupo === r.grupo && !ehProvisorio(x); });
      if (!membros.some(function (x) { return x.conta; })) return;
      agora.push(membros.length > 1 ? r.grupo + ': ' + membros.map(function (x) { return minuscula(x.documento); }).join(' ou ') : r.documento);
    } else if (r.conta) {
      agora.push(r.documento);
    }
  });
  return { agora: agora, depois: regras.filter(function (r) { return definitivo[r.codigo]; }).map(function (r) { return r.documento; }) };

/** Preenche as folhas: é a prévia na tela e exatamente o que vai para o papel. */
function montarFolhas() {
  const cfg = estado.config, folhas = $('folhas');
  if (!folhas || !cfg) return;
  let conteudo;
  if (imp.modo === 'tiras') {
    const lote = paraTiras().filter(function (v) { return imp.escolhidos[v.insc]; });
    conteudo = lote.length ? emPares(lote.map(function (v) { return elTira(cfg, v.cota, v.curso, v.nome, v.docsEm || '', linhasDaTira(cfg, v)); })) : [el('p', { text: 'Nenhuma tira marcada.' })];
  } else if (imp.modo === 'pendencias') {
    conteudo = folhaDePendencias(cfg);
  } else if (imp.modo === 'balanco') {
    conteudo = folhaDoBalanco(cfg);
  } else if (imp.modo === 'publicar') {
    conteudo = folhaParaPublicar(cfg);
    if (impPecas.avisosPub) trocarFilhos(impPecas.avisosPub, avisosParaPublicar(dadosParaPublicar(cfg)).map(function (a) { return el('p', { text: a }); }));
  } else if (imp.modo === 'lembretes') {

    conteudo = itens.length ? itens : [el('p', { text: 'Informe quantos lembretes.' })];
  } else {
    const quantas = quantidadesEmBranco(cfg), itens = [];
    modelosEmBranco(cfg).forEach(function (m) {
      for (let i = 0; i < (quantas[m.chave] || 0); i++) itens.push(elTira(cfg, m.cota, null, null, '____/____/______', linhasEmBranco(cfg, m.cota, m.etnia)));
    });
    conteudo = itens.length ? emPares(itens) : [el('p', { text: 'Informe quantas tiras de cada cota.' })];

}

function imprimirAgora() {
  if (temPendencia()) { avisar('Espere as marcações serem salvas ("Tudo salvo") antes de imprimir.'); return; }
  if (imp.modo === 'tiras') {
    const lote = paraTiras().filter(function (v) { return imp.escolhidos[v.insc]; });
    if (!lote.length) { avisar('Marque pelo menos uma tira.'); return; }
    // guarda o que cada tira mostra agora: é isso que a planilha vai registrar como impresso
    imp.impressos = lote.map(function (v) { return { insc: v.insc, sinal: estado.candidatos[v.insc].sinal }; });
    imp.erro = '';
  }
  desenharImpressao();
  setTimeout(function () { window.print(); }, 60);
}

function confirmarImpressas() {
  const tiras = imp.impressos;
  if (!tiras || imp.enviando) return;
  imp.enviando = true; imp.erro = '';
  desenharImpressao();
  chamar({ acao: 'imprimiu', atendente: estado.nome, tiras: tiras }).then(function (r) {
    imp.enviando = false;
    if (r.ok) {
      (r.candidatos || []).forEach(function (c) { estado.candidatos[c.insc] = c; estado.gravadoEm[c.insc] = Date.now(); imp.escolhidos[c.insc] = false; });
      imp.impressos = null;
      avisar(tiras.length === 1 ? 'Tira marcada como impressa.' : tiras.length + ' tiras marcadas como impressas.');
    } else if (r.erro === 'codigo' || r.erro === 'sem_codigo') {
      pedirEntrada(r.mensagem);
    } else {
      imp.erro = (r.erro === 'rede' ? 'Sem conexão: a planilha ainda não sabe que as tiras saíram.' : (r.mensagem || 'A planilha não registrou a impressão.'));
    }
    desenhar();
  });
}

/* ---------- filtro da lista por cota */
function naCota(v) { return !estado.cota || (estado.cota === '*' ? !!v.cota && v.cota !== 'AC' : v.cota === estado.cota); }
/** Monta as opções da caixa "Todas as cotas" com as cotas que têm candidato. Só refaz a caixa quando a lista de opções muda. */
function montarFiltroDeCota(todos) {

  todos.forEach(function (v) { if (v.cota) tem[v.cota] = true; });

  siglas.forEach(function (c) { opcoes.push([c, c]); });
  if (estado.cota && !opcoes.some(function (o) { return o[0] === estado.cota; })) estado.cota = '';
  const assinatura = opcoes.map(function (o) { return o[0]; }).join();
  if (caixa.getAttribute('data-opcoes') !== assinatura) {
    trocarFilhos(caixa, opcoes.map(function (o) { return el('option', { value: o[0], text: o[1], title: ROTULO_COTA[o[0]] || null }); }));

/* ====================================================================== */
/* 9. Chamada dos classificáveis (pede a planilha na versão 10)            */
/*    A regra é calculada aqui (Regra.calcular) a cada desenho, a partir   */
/*    do que a planilha guarda de cada pessoa. "Presente", "Ausente" e     */
/*    "Reintegrar" aparecem na hora e são enviados em fila, na ordem; os   */
/*    demais pedidos (troca, desfazer) travam os botões até a resposta.    */
/* ====================================================================== */
const cham = { curso: '', fila: [], enviando: null, falha: '', tentativas: 0, pausaAte: 0, troca: null, desfeitas: [], pecas: null, proximo: '', trancadoAte: 0, busca: '', chave: false, retorno: false };
let temporizadorChamada = 0;

function temChamada() { const cfg = estado.config; return !!(cfg && Number(cfg.versao) >= 10 && cfg.chamada); }
/** Classificável confirmado na chamada (presente): ocupa vaga, a não ser que depois tenha sido indeferido. */
function daChamada(v) { return !!(v && v.ch && v.ch.e === 'P'); }
function horaLocal(t) { const d = new Date(t); return doisDigitos(d.getDate()) + '/' + doisDigitos(d.getMonth() + 1) + ' ' + doisDigitos(d.getHours()) + ':' + doisDigitos(d.getMinutes()); }
function soHora(em) { return String(em || '').slice(-5); }
function opsPendentes() { return (cham.enviando ? [cham.enviando] : []).concat(cham.fila); }
function chamadaPendente(insc) { return opsPendentes().some(function (o) { return o.insc === insc; }); }
function chamadaOcupada() { return opsPendentes().some(function (o) { return !o.otimista; }); }

/** A pessoa com o que ainda está a caminho da planilha (presente, ausente, reintegrar), para a tela seguir sem esperar. */
function comChamada(v) {
  const ops = opsPendentes().filter(function (o) { return o.insc === v.insc && o.otimista; });
  if (!ops.length) return v;
  const a = v.ch || {};
  const ch = { e: a.e || '', l: a.l || '', o: a.o || '', em: a.em || '', t: a.t || 0, por: a.por || '', tr: a.tr || '' };
  ops.forEach(function (o) {
    if (o.op === 'presenca') {                          // registro de presença: aparece na hora, como o resto
      if (o.valor) v.pr = { t: o.t, em: horaLocal(o.t), por: estado.nome }; else delete v.pr;
      return;
    }
    ch.t = o.t; ch.em = horaLocal(o.t); ch.por = estado.nome;
    if (o.op === 'presente') {
      ch.e = 'P'; ch.l = o.lista; ch.o = o.origem; ch.tr = o.manual ? 'regra: ' + o.regra.cota + '/' + o.regra.origem : '';
      v.cota = o.cota;
      if (!v.situacao) v.situacao = estado.config.nomes.aguardando;
    } else if (o.op === 'ausente') { ch.e = 'A'; ch.l = o.lista; ch.o = ''; ch.tr = ''; }
    else if (o.op === 'reintegrar') ch.e = 'R';
  });
  if (ch.e || a.e !== undefined) v.ch = ch;
  v.local = true;
  return v;
}

/** Põe um pedido da chamada na fila de envio. Cada pedido leva um "id": se o envio for repetido, a planilha não o executa duas vezes. */
function pedirChamada(op) {
  op.t = Date.now();
  op.id = op.t.toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  if (op.acao === 'dia') {
    /* presença, chave e balcão não entram no "Desfazer última ação" */
  } else if (op.op === 'desfazer') {
    for (let k = cham.desfeitas.length - 1; k >= 0; k--) if (cham.desfeitas[k].insc === op.insc) { cham.desfeitas.splice(k, 1); break; }
  } else {
    cham.desfeitas.push({ insc: op.insc, op: op.op });
  }
  cham.fila.push(op);
  desenhar();
  bombearChamada();
}

/** Envia o próximo pedido da chamada. Um por vez, na ordem em que foram feitos. */
function bombearChamada() {
  clearTimeout(temporizadorChamada);
  if (cham.enviando || estado.bloqueado || !cham.fila.length) return;
  const agora = Date.now();
  if (agora < cham.pausaAte) { temporizadorChamada = setTimeout(bombearChamada, cham.pausaAte - agora + 5); return; }
  const op = cham.fila.shift();
  cham.enviando = op;
  desenhar();
  const pedido = { acao: 'chamada', atendente: estado.nome };
  Object.keys(op).forEach(function (k) { if (k !== 't' && k !== 'otimista' && k !== 'depois') pedido[k] = op[k]; });
  chamar(pedido).then(function (r) {
    cham.enviando = null;
    if (r.ok) {
      (r.candidatos || []).forEach(function (c) { estado.candidatos[c.insc] = c; estado.gravadoEm[c.insc] = Date.now(); });
      if (Array.isArray(r.soPresentes) && estado.config) estado.config.soPresentes = r.soPresentes;
      cham.falha = ''; cham.tentativas = 0; cham.pausaAte = 0;
      if (op.depois) { try { op.depois(r); } catch (e) { /* o que vem depois não pode travar a fila */ } }
      // balcão: a resposta só traz quem este pedido mudou; busca logo o que os outros atendentes fizeram
      if (op.acao === 'dia' && op.op !== 'presenca') setTimeout(function () { consultar(true); }, 0);
    } else if (r.erro === 'codigo' || r.erro === 'sem_codigo') {
      cham.fila.unshift(op);
      pedirEntrada(r.mensagem);
    } else if (r.erro === 'rede' || r.erro === 'ocupada' || r.erro === 'resposta') {
      // não chegou ou a planilha estava ocupada: o mesmo pedido volta para a frente da fila e é tentado de novo
      cham.fila.unshift(op);
      cham.tentativas++;
      cham.falha = r.erro === 'ocupada' ? 'A planilha está ocupada.' : (r.erro === 'rede' ? 'Sem conexão.' : 'A planilha não respondeu direito.');
      cham.pausaAte = Date.now() + Math.min(4000 * cham.tentativas, 30000);
    } else {
      // a planilha recusou: este pedido e os que vinham depois dele (feitos contando com ele) não valem
      const perdidos = cham.fila.length;
      cham.fila = []; cham.desfeitas = []; cham.troca = null; cham.falha = ''; cham.tentativas = 0; cham.pausaAte = 0;
      if (op.depois) { try { op.depois(r); } catch (e) { /* idem */ } }
      avisar((r.mensagem || 'A planilha recusou o pedido.') + (perdidos ? ' ' + (perdidos === 1 ? 'O pedido seguinte não foi enviado' : 'Os ' + perdidos + ' pedidos seguintes não foram enviados') + ': confira a chamada.' : ''));
      consultar(true);
    }
    desenhar();
    bombearChamada();
  });
}

/** Tudo o que a chamada de um curso precisa: a entrada da regra, o resultado dela e as pessoas pela inscrição. */
function dadosDaChamada(cfg, curso, todos) {
  const bal = dadosDoBalanco(cfg).filter(function (d) { return d.curso === curso; })[0] || null;
  const ociosas = {};
  cfg.cotas.forEach(function (k) { ociosas[k] = bal ? bal.ociosas[k] : 0; });
  ociosas[Regra.SEM] = bal ? bal.semAprovado : 0;
  const porInsc = {};
  const pessoas = todos.filter(function (v) { return v.curso === curso && v.lista === cfg.classificavel; }).map(function (v) {
    porInsc[v.insc] = v;
    const tipo = Logica.tipoSituacao(v.situacao), ch = v.ch || {};
    // atendido direto na planilha, sem registro de chamada (contingência): ocupa uma vaga do curso, sem cota de origem
    const aMao = !ch.e && (tipo === 'concluida' || tipo === 'pendencia');
    return { insc: v.insc, pos: Regra.posicoes(v.outras), e: aMao ? 'P' : (ch.e || ''), cota: v.cota, o: ch.o || '', fixa: tipo === 'fixa', presenca: !!v.pr };
  });
  const entrada = { vagas: bal ? bal.vagas : 0, seguram: bal ? bal.soma(bal.seguram) : 0, ociosas: ociosas, pessoas: pessoas, soPresentes: soPresentesEm(cfg, curso) };
  return { curso: curso, entrada: entrada, r: Regra.calcular(entrada), porInsc: porInsc, bal: bal };
}

          onclick: function () { estado.semResposta = 0; consultar(true); } }),

  }

  cham.proximo = '';

function fecharChamada() {

}
function fichaPelaChamada(insc) {

}

function desenharChamada() {
  const painel = $('chamada');
  if (painel.hidden || !cham.pecas || !estado.config) return;
  if (!temChamada()) { fecharChamada(); return; }
  const cfg = estado.config, P = cham.pecas;
  const todos = Object.keys(estado.candidatos).map(visao);
  const cursos = cfg.cursos.map(function (c) { return c.nome; }).filter(function (nome) { return todos.some(function (v) { return v.curso === nome && (v.lista === cfg.classificavel || temRetorno(v)); }); });
  if (cursos.indexOf(cham.curso) < 0) cham.curso = cursos[0] || '';
  trocarFilhos(P.cursos, cursos.map(function (nome) {
    return el('button', { class: 'botao pequeno', type: 'button', 'aria-pressed': cham.curso === nome ? 'true' : 'false', 'data-curso': nome, 'data-foco': 'ch-curso:' + nome, text: nome,
      onclick: function () { cham.curso = nome; cham.troca = null; cham.proximo = ''; desenhar(); } });
  }));
  const pendentes = opsPendentes().length;
  P.gravacao.textContent = cham.falha ? 'Não gravou. ' + cham.falha + ' Tentando de novo.' : (pendentes ? 'Gravando…' : 'Tudo gravado');
  P.gravacao.className = 'ch-gravacao' + (cham.falha ? ' erro' : '');
  P.tentar.hidden = !cham.falha;
  if (!cham.curso) {
    trocarFilhos(P.forma); trocarFilhos(P.achados); trocarFilhos(P.abas);
    trocarFilhos(P.avisos);
    trocarFilhos(P.esq, el('p', { class: 'ch-vazio', text: 'Nenhum curso tem classificáveis na planilha.' }));
    trocarFilhos(P.dir);
    return;
  }
  const d = dadosDaChamada(cfg, cham.curso, todos);
  trocarFilhos(P.avisos, avisosDaChamada(d));
  trocarFilhos(P.forma, elForma(d));
  trocarFilhos(P.achados, elAchados(d, todos));
  desenharAbas(d);
  const nomes = P.esq.querySelector('.ch-nomes'), chamados = P.dir.querySelector('.ch-chamados');
  const y1 = nomes ? nomes.scrollTop : 0, y2 = chamados ? chamados.scrollTop : 0;
  trocarFilhos(P.esq, elVagaEProximo(d), elTroca(d), elListaNaVez(d));

function casasDasNotas(pessoas) {
  let casas = 0;
  pessoas.forEach(function (v) {
    if (typeof v.nt !== 'number') return;
    const t = String(Math.round(v.nt * 1000) / 1000), p = t.indexOf('.');
    if (p >= 0) casas = Math.max(casas, t.length - p - 1);
  });
  return casas;
}
function tituloDaLista(l) { return l === Regra.GERAL ? 'Listagem geral: ampla concorrência (AC)' : 'Reserva de vagas ' + l; }
function rotuloDaOrigem(o) { return o === Regra.GERAL ? 'Ampla' : (o === Regra.SEM ? 'Sem aprovado no resultado' : o); }

/** Por curso: o que a chamada vai oferecer em cada cota de origem e quem ainda pode ser chamado em cada lista. */
function dadosParaPublicar(cfg) {
  const todos = Object.keys(estado.candidatos).map(visao);
  return cfg.cursos.map(function (c) {
    const d = dadosDaChamada(cfg, c.nome, todos);
    const listas = Regra.LISTAS.map(function (l) {
      return { lista: l, itens: d.r.listas[l].filter(function (x) { return x.como === 'livre' || x.como === 'sem_presenca'; })
        .map(function (x) { return { v: d.porInsc[x.insc], pos: x.pos }; }) };
    });
    const gente = {};
    listas.forEach(function (l) { l.itens.forEach(function (x) { gente[x.v.insc] = x.v; }); });
    const pessoas = Object.keys(gente).map(function (i) { return gente[i]; });
    return { curso: c.nome, r: d.r, listas: listas, pessoas: pessoas, aguardando: d.bal ? d.bal.soma(d.bal.aguardando) : 0,
      semNota: pessoas.filter(function (v) { return v.nt === undefined || v.nt === ''; }).length };
  });
}

function avisosParaPublicar(dados) {
  const avisos = [];
  const aguardando = dados.filter(function (d) { return d.aguardando; });
  if (aguardando.length) avisos.push('Ainda há aprovados em "Aguardando" (' + aguardando.map(function (d) { return d.curso + ' ' + d.aguardando; }).join(', ') +
    '). Eles contam como vaga ociosa. Antes de publicar, use na planilha o menu Pré-matrícula > Encerrar a pré-matrícula dos aprovados.');
  const semNota = dados.reduce(function (s, d) { return s + d.semNota; }, 0);
  if (semNota) avisos.push(!estado.config.pontuacao ? 'As listas estão sem pontuação: a planilha ainda não tem a coluna "Pontuação" (menu Pré-matrícula > 1. Montar ou conferir a base).' :
    semNota + (semNota === 1 ? ' classificável está' : ' classificáveis estão') + ' sem pontuação. Na planilha, cole o arquivo do resultado na aba Importar e use o menu Pré-matrícula > Importar só a pontuação.');
  if (temPendencia()) avisos.push('Há marcações ainda não salvas. Espere a tela dizer "Tudo salvo".');
  return avisos;
}

function folhaParaPublicar(cfg) {

    })));

    listas
  ];
}

/** Copia um pedaço da folha (com as tabelas) para a área de transferência, para colar no documento. */
function copiarDaFolha(id, oQue) {
  const no = $(id);
  if (!no) return;
  const selecao = window.getSelection(), faixa = document.createRange();
  faixa.selectNode(no);
  selecao.removeAllRanges();
  selecao.addRange(faixa);
  let certo = false;
  try { certo = document.execCommand('copy'); } catch (e) { certo = false; }
  if (certo) selecao.removeAllRanges();
  avisar(certo ? oQue + ': copiado. Cole no seu documento.' : 'Não consegui copiar sozinho. O trecho ficou selecionado: copie com Ctrl+C.');
}

function opcoesParaPublicar(cfg) {

  chave.addEventListener('change', function () { pub.vazias = chave.checked; montarFolhas(); });
  impPecas.botao.textContent = 'Imprimir ou salvar em PDF';
  return [el('p', { text: 'O quadro de vagas e as listas dos classificáveis, para o documento que será publicado. Os números são os deste momento: confira "Tudo salvo" e use "Atualizar agora" antes de copiar.' }),

      el('button', { class: 'botao', type: 'button', id: 'pub-copiar-listas', text: 'Copiar as listas', onclick: function () { copiarDaFolha('pub-listas', 'Listas'); } }),
      impPecas.botao)];
}

/* ====================================================================== */
/* 11. O dia da chamada: busca, presença, a chave "só quem teve a presença */
/*     registrada", regularização do +1 e o histórico (planilha versão 11) */
/* ====================================================================== */
const TEXTO_SO_PRESENTES = 'A partir de agora serão chamados apenas os candidatos com presença registrada. Quem está presente e ainda não se apresentou à equipe, apresente-se agora.';
const hist = { aba: 'chamada', linhas: null, carregando: false, erro: '', recentes: true, imprimindo: false, em: '' };

function temDia() { const cfg = estado.config; return !!(cfg && cfg.dia); }
function soPresentesEm(cfg, curso) { return (cfg.soPresentes || []).indexOf(curso) >= 0; }
function pedirDia(op) { op.acao = 'dia'; pedirChamada(op); }

/** Presença e a forma de chamar: quantos já têm presença, e a chave do curso (com o texto para ler em voz alta ao ligar). */
function elForma(d) {
  if (!temDia()) return null;
  const cfg = estado.config, ligada = soPresentesEm(cfg, d.curso);
  const aChamar = d.entrada.pessoas.filter(function (p) { return (p.e === '' || p.e === 'R') && !p.fixa; });
  const com = aChamar.filter(function (p) { return p.presenca; }).length, sem = aChamar.length - com;

    title: ligada ? 'Clique para voltar a chamar todos os nomes' : 'A fila passa a pular quem não tem presença registrada',

    el('div', { class: 'acoes' },

/** Resultado da busca: o classificável e o que dá para fazer com ele (presença, reintegrar, ficha, trocar a vaga). */

  const cfg = estado.config, P = cham.pecas;

  }).sort(function (a, b) { return ((a.curso === d.curso ? 0 : 1) - (b.curso === d.curso ? 0 : 1)) || a.nome.localeCompare(b.nome, 'pt-BR'); });

        el('span', { class: 'ch-m', text: ['inscrição ' + v.insc, doCurso ? '' : v.curso, v.outras, situacao, v.pr ? 'presença às ' + soHora(v.pr.em) + (v.pr.por ? ' (por ' + v.pr.por + ')' : '') : ''].filter(function (x) { return x; }).join(' · ') })),
      el('span', { class: 'acoes' }, acoes));
  });

    el('h3', {}, 'Busca', el('small', { text: gente.length ? gente.length + (gente.length === 1 ? ' pessoa' : ' pessoas') + (gente.length > 8 ? ' (mostrando 8: digite mais)' : '') : '' })),
    gente.length ? el('ul', { class: 'ch-chamados' }, itens) : el('p', { class: 'ch-vazio', text: 'Nenhum classificável com esse nome ou inscrição.' }));

/** Sobrou vaga livre numa cota que tem alguém a mais (+1): oferece pôr a pessoa na vaga normal. */

/* ---------- aprovados que não compareceram no prazo e aparecem na chamada (ação excepcional) */

function aprovadoDeVolta(v) { return v.lista === estado.config.aprovado && daChamada(v) && Logica.tipoSituacao(v.situacao) !== 'fixa'; }

  return el('p', { class: 'alerta vaga', id: 'ficha-vaga' }, 'Chamada dos classificáveis. ',
    el('span', { text: 'Aprovado(a) que não compareceu no prazo dos aprovados; presente na chamada em ' + v.ch.em + ' (ação excepcional). Ocupa a própria vaga, de ' + Regra.nomeDaVaga(v.cota) + '.' }));

  });
  const vaga = d.r.vaga;
  const esgotada = !(vaga && vaga.proximo), cabe = d.r.capacidade > 0;
  if (!voltaram.length && !ausentes.length) return null;
  const ocupada = chamadaOcupada();
  const aberto = cham.retorno && esgotada && cabe;
  const visiveis = ausentes.filter(function (v) { return !termo || Logica.semAcento(v.nome).indexOf(termo) >= 0 || String(v.insc).indexOf(termo) === 0; });
  return el('section', { class: 'ch-bloco', id: 'ch-retorno' },

        onclick: function () { cham.retorno = !cham.retorno; desenhar(); } }) : null),
    ausentes.length && !(esgotada && cabe) ? el('p', { class: 'ch-vazio', text: !esgotada ? 'Fica disponível quando não houver mais classificáveis para chamar neste curso.' : 'O curso não tem vaga livre.' }) : null,
    voltaram.length || aberto ? el('ul', { class: 'ch-chamados', id: 'ch-retorno-lista' },
      voltaram.map(function (v) {

          el('span', { class: 'acoes' },
            el('button', { class: 'botao pequeno', type: 'button', 'data-ficha': v.insc, text: 'Ficha', onclick: function () { fichaPelaChamada(v.insc); } }),
            el('button', { class: 'botao pequeno', type: 'button', 'data-retorno-desfazer': v.insc, disabled: ocupada, text: 'Desfazer',
              onclick: function () { if (!chamadaOcupada() && window.confirm('Desfazer a presença de ' + v.nome + ' na chamada? Volta a "' + cfg.nomes.ausente + '".')) pedirDia({ op: 'retorno', insc: v.insc, valor: false }); } })));
      }),
      aberto ? visiveis.map(function (v) {
        return el('li', { 'data-insc': v.insc, 'data-estado': 'ausente' }, el('span', { class: 'ch-hora', text: v.clas ? v.clas + 'º' : '' }),
          el('span', {}, el('span', { class: 'ch-n', text: v.nome }), el('span', { class: 'ch-m', text: 'Aprovado em ' + Regra.nomeDaVaga(v.cota) + ' · inscrição ' + v.insc + ' · ' + (v.situacao || '').toLowerCase() })),
          el('span', { class: 'acoes' }, el('button', { class: 'botao principal pequeno', type: 'button', 'data-retorno': v.insc, 'data-foco': 'ch-retorno:' + v.insc, disabled: ocupada, text: 'Presente',
            onclick: function () {
              if (chamadaOcupada()) return;
              if (window.confirm(v.nome + ' foi aprovado(a) e não compareceu no prazo. Registrar como presente na chamada dos classificáveis? É uma ação excepcional: volta a ocupar a vaga e entra na fila do balcão. Fica no Registro.')) pedirDia({ op: 'retorno', insc: v.insc, valor: true });
            } })));
      }) : null) : null);
}

/* ---------- histórico da chamada: as linhas do Registro dos classificáveis */
function carregarHistorico() {
  if (hist.carregando) return;
  hist.carregando = true; hist.erro = '';
  desenharChamada();
  chamar({ acao: 'historico' }).then(function (r) {
    hist.carregando = false;
    if (r.ok) { hist.linhas = r.linhas || []; hist.em = hoje(); }
    else hist.erro = r.mensagem || 'A planilha não entregou o histórico.';
    desenharChamada();
  });
}
function desenharAbas(d) {
  const P = cham.pecas;
  const abas = [['chamada', 'Chamada'], ['historico', 'Histórico']];
  trocarFilhos(P.abas, Number(estado.config.versao) >= 11 ? abas.map(function (a) {
    return el('button', { class: 'botao pequeno', type: 'button', 'aria-pressed': hist.aba === a[0] ? 'true' : 'false', 'data-aba': a[0], 'data-foco': 'ch-aba:' + a[0], text: a[1],
      onclick: function () { hist.aba = a[0]; if (a[0] === 'historico') carregarHistorico(); desenhar(); } });
  }) : null);
  const mostra = hist.aba === 'historico';
  P.corpo.hidden = mostra;
  P.historico.hidden = !mostra;
  if (!mostra) return;
  const nomeDe = function (insc) { const c = estado.candidatos[insc]; return c ? c.nome : ''; };
  const cursoDe = function (insc) { const c = estado.candidatos[insc]; return c ? c.curso : ''; };
  let linhas = (hist.linhas || []).filter(function (l) { return l.insc ? cursoDe(l.insc) === d.curso : l.det.indexOf(' em ' + d.curso) >= 0; });
  const total = linhas.length;
  if (hist.recentes && !hist.imprimindo) linhas = linhas.slice().reverse();
  const chave = el('input', { type: 'checkbox', id: 'ch-hist-recentes', checked: hist.recentes });
  chave.addEventListener('change', function () { hist.recentes = chave.checked; desenharChamada(); });
  trocarFilhos(P.historico,
    el('div', { class: 'ch-hist-controles' },
      el('button', { class: 'botao pequeno', type: 'button', id: 'ch-hist-atualizar', disabled: hist.carregando, text: hist.carregando ? 'Buscando…' : 'Atualizar o histórico', onclick: carregarHistorico }),
      el('label', { class: 'imp-chave' }, chave, 'Mais recentes primeiro'),
      el('button', { class: 'botao pequeno', type: 'button', id: 'ch-hist-imprimir', disabled: !total, text: 'Imprimir (em ordem de hora)', onclick: imprimirHistorico }),
      el('span', { class: 'ch-m', text: hist.erro ? hist.erro : (hist.linhas ? total + (total === 1 ? ' registro' : ' registros') + ' · lido às ' + hist.em.slice(-5) + ' (não atualiza sozinho)' : '') })),
    el('div', { class: 'ch-hist-folha' },
      el('div', { class: 'lp-cab' }, el('strong', { text: 'Histórico da chamada dos classificáveis: ' + d.curso }), el('span', { text: doProcesso(estado.config) + ' · emitido em ' + (hist.em || hoje()) })),
      total ? el('table', { class: 'ch-hist', id: 'ch-hist' },
        el('thead', {}, el('tr', {}, ['Data e hora', 'Quem', 'Inscrição', 'Nome', 'Ação', 'Detalhe'].map(function (t) { return el('th', { scope: 'col', text: t }); }))),
        el('tbody', {}, linhas.map(function (l) {
          return el('tr', { 'data-acao': l.acao }, el('td', { text: l.em }), el('td', { text: l.quem }), el('td', { text: l.insc }), el('td', { text: nomeDe(l.insc) }), el('td', { text: l.acao }), el('td', { text: l.det }));
        }))) : el('p', { class: 'ch-vazio', text: hist.carregando ? 'Buscando o histórico…' : (hist.erro ? '' : 'Nada registrado ainda para os classificáveis de ' + d.curso + '.') })));
}
function imprimirHistorico() {
  hist.imprimindo = true;
  desenharChamada();
  document.body.classList.add('imprimindo-historico');
  setTimeout(function () { window.print(); setTimeout(function () { hist.imprimindo = false; document.body.classList.remove('imprimindo-historico'); desenharChamada(); }, 400); }, 60);
}

/* ====================================================================== */
/* 12. Balcão: a fila de quem foi confirmado na chamada, "Atender o        */
/*     próximo", a trava na ficha e o painel só de leitura                  */
/*     (planilha versão 11; quem escolhe o próximo é a planilha)           */
/* ====================================================================== */
function souEu(nome) { return Logica.chave(nome) === Logica.chave(estado.nome); }
/** Confirmado na chamada, ainda não atendido: espera na fila do balcão. */
function naFilaDoBalcao(v) {
  const tipo = Logica.tipoSituacao(v.situacao);
  return daChamada(v) && tipo !== 'fixa' && tipo !== 'concluida' && (!v.bc || v.bc.e === 'D');
}
/** A fila na ordem: os devolvidos primeiro (pela hora da devolução), depois pela hora da confirmação na chamada. */
function filaDoBalcao(todos) {
  return todos.filter(naFilaDoBalcao).sort(function (a, b) {
    const da = !!(a.bc && a.bc.e === 'D'), db = !!(b.bc && b.bc.e === 'D');
    return (da === db ? 0 : (da ? -1 : 1)) || ((da ? a.bc.t : a.ch.t) - (db ? b.bc.t : b.ch.t)) || a.nome.localeCompare(b.nome, 'pt-BR');
  });
}
function balcaoOcupado() { return opsPendentes().some(function (o) { return o.acao === 'dia' && o.op !== 'presenca' && o.op !== 'chave'; }); }
/** Antes de encerrar um atendimento sem nenhum documento marcado, pergunta: a pessoa sairia da fila sem nada registrado. */
function podeEncerrar(lista, depois) {
  const sem = lista.filter(function (v) { return Logica.tipoSituacao(v.situacao) !== 'fixa' && !Object.keys(Logica.marcados(v.docs)).length; });
  return !sem.length || window.confirm('Nenhum documento foi marcado para ' + sem.map(function (v) { return v.nome; }).join(' e ') + '. Encerrar assim mesmo' + (depois || '') + '?');
}
function pedirProximo() {
  if (balcaoOcupado()) return;
  const meus = Object.keys(estado.candidatos).map(visao).filter(function (v) { return daChamada(v) && v.bc && v.bc.e === 'E' && souEu(v.bc.por); });
  if (!podeEncerrar(meus, ' e atender o próximo')) return;
  pedirDia({ op: 'proximo', depois: function (r) {
    if (!r.ok) return;
    if (r.insc) { if (!$('chamada').hidden) fecharChamada(); fecharBalcao(); abrir(r.insc); }
    else avisar('Não há mais ninguém na fila do balcão.');
  } });
}

/** Barra no alto da lista: quantos esperam, quem está com este atendente e o botão "Atender o próximo". */
function desenharBarraDoBalcao() {
  const barra = $('balcao-barra');
  if (!temDia() || !temChamada()) { barra.hidden = true; return; }
  const todos = Object.keys(estado.candidatos).map(visao);
  const fila = filaDoBalcao(todos);
  const meus = todos.filter(function (v) { return daChamada(v) && v.bc && v.bc.e === 'E' && souEu(v.bc.por); });
  if (!fila.length && !meus.length) { barra.hidden = true; return; }
  barra.hidden = false;
  const ocupado = balcaoOcupado();
  trocarFilhos(barra,
    el('span', { class: 'bb-texto' }, el('b', { text: 'Balcão: ' }), fila.length ? (fila.length === 1 ? '1 pessoa na fila' : fila.length + ' pessoas na fila') : 'ninguém na fila',
      meus.length ? [' · com você: ', meus.map(function (v) {
        return el('button', { class: 'bb-meu', type: 'button', 'data-meu': v.insc, text: v.nome.split(' ').slice(0, 2).join(' '), title: 'Abrir a ficha', onclick: function () { abrir(v.insc); } });
      })] : null),
    el('button', { class: 'botao principal pequeno', type: 'button', id: 'balcao-proximo', 'data-foco': 'balcao-proximo', disabled: ocupado,
      text: ocupado ? 'Aguarde…' : (meus.length ? (fila.length ? 'Encerrar e atender o próximo' : 'Encerrar o atendimento') : 'Atender o próximo'),
      title: 'A planilha entrega a próxima pessoa da fila: dois atendentes nunca recebem a mesma', onclick: pedirProximo }));
}

/** Com a fila do balcão, a ficha de quem foi confirmado na chamada só é mexida por quem está atendendo a pessoa. */
function fichaTravada(v, tipo) {
  if (!temDia() || !daChamada(v) || tipo === 'fixa') return false;
  if (v.bc && v.bc.e === 'E') return !souEu(v.bc.por);
  if (v.bc && v.bc.e === 'T') return false;
  return tipo !== 'concluida';
}
function elBalcaoNaFicha(v, insc, tipo) {
  if (!temDia() || tipo === 'fixa') return null;
  const bc = v.bc, ocupado = balcaoOcupado();
  const botao = function (id, texto, fazer, principal) {
    return el('button', { class: 'botao pequeno' + (principal ? ' principal' : ''), type: 'button', id: id, 'data-foco': id, disabled: ocupado, text: texto, onclick: function () { if (!balcaoOcupado()) fazer(); } });
  };
  if (bc && bc.e === 'E' && souEu(bc.por)) {
    return el('p', { class: 'alerta fila-balcao', id: 'ficha-balcao', 'data-estado': 'meu' }, 'Balcão. ', el('span', { text: 'Em atendimento com você desde ' + soHora(bc.em) + '.' }),
      el('span', { class: 'acoes' },
        botao('fb-proximo', 'Encerrar e atender o próximo', pedirProximo, true),
        botao('fb-encerrar', 'Encerrar', function () { if (podeEncerrar([v])) pedirDia({ op: 'concluir', insc: insc }); }),
        botao('fb-devolver', 'Devolver à fila', function () { pedirDia({ op: 'devolver', insc: insc }); })));
  }
  if (bc && bc.e === 'E') {
    return el('p', { class: 'alerta fila-balcao', id: 'ficha-balcao', 'data-estado': 'outro' }, 'Balcão. ', el('span', { text: 'Em atendimento com ' + bc.por + ' desde ' + soHora(bc.em) + '. Aqui, os documentos ficam travados.' }),
      botao('fb-assumir', 'Assumir o atendimento', function () {
        if (window.confirm('Assumir o atendimento de ' + v.nome + ', que está com ' + bc.por + '? Fica no Registro.')) pedirDia({ op: 'atender', insc: insc, assumir: true });
      }));
  }
  if (bc && bc.e === 'T') {
    return el('p', { class: 'alerta fila-balcao', id: 'ficha-balcao', 'data-estado': 'atendido' }, 'Balcão. ', el('span', { text: 'Atendido por ' + bc.por + ' às ' + soHora(bc.em) + '.' }));
  }
  if (tipo === 'concluida') return null;
  const fila = filaDoBalcao(Object.keys(estado.candidatos).map(visao));
  const pos = fila.map(function (x) { return x.insc; }).indexOf(insc) + 1;
  return el('p', { class: 'alerta fila-balcao', id: 'ficha-balcao', 'data-estado': 'fila' }, 'Balcão. ',
    el('span', { text: 'Na fila: ' + pos + 'º de ' + fila.length + (bc && bc.e === 'D' ? ' (devolvido à fila)' : '') + '. Os documentos ficam travados até o atendimento começar.' }),
    botao('fb-atender', pos <= 1 ? 'Atender agora' : 'Atender fora da ordem…', function () {
      let obs = '';
      if (pos > 1) {
        obs = window.prompt('Atender ' + v.nome + ' fora da ordem? Há ' + (pos - 1) + (pos === 2 ? ' pessoa' : ' pessoas') + ' na frente. Fica no Registro.\nObservação (opcional):', '');
        if (obs === null) return;
      }
      pedirDia({ op: 'atender', insc: insc, obs: obs });
    }, pos <= 1));
}
/** Desliga os controles da ficha travada (e religa os que ela mesma desligou, quando destrava). */
function travarPeloBalcao(v, tipo) {
  const travada = fichaTravada(v, tipo);
  [pecas.blocoDocs, pecas.blocoSituacao, pecas.motivos, pecas.blocoBanca].forEach(function (bloco) {
    if (!bloco) return;
    bloco.classList.toggle('travado', travada);
    Array.prototype.forEach.call(bloco.querySelectorAll('input, button, select, textarea'), function (x) {
      if (travada) { if (!x.disabled) { x.disabled = true; x.setAttribute('data-travado', ''); } }
      else if (x.hasAttribute('data-travado')) { x.disabled = false; x.removeAttribute('data-travado'); }
    });
  });
}

/** Os documentos que ainda faltam marcar para a pessoa (os da cota da vaga que ela ocupa). */
function docsACobrar(v) {
  return Logica.regrasDe(estado.config, v.docs).filter(function (r) { return !v.docs[r.codigo]; }).map(function (r) { return r.documento; }).join('; ');
}

/* ---------- painel do balcão: só leitura, para o computador que fica à vista da equipe */
function abrirBalcao() {
  if (!temDia()) { avisar('O balcão pede a planilha na versão 11, com o item 1 do menu já usado.'); return; }
  $('balcao').hidden = false;
  document.body.classList.add('com-chamada');
  desenharBalcao();
}
function fecharBalcao() {
  $('balcao').hidden = true;
  if ($('chamada').hidden) document.body.classList.remove('com-chamada');
}
function desenharBalcao() {
  desenharBarraDoBalcao();
  const painel = $('balcao');
  if (painel.hidden) return;
  if (!temDia()) { fecharBalcao(); return; }
  const todos = Object.keys(estado.candidatos).map(visao);
  const fila = filaDoBalcao(todos);
  const comBalcao = function (e) { return todos.filter(function (v) { return daChamada(v) && v.bc && v.bc.e === e; }); };
  const atendendo = comBalcao('E').sort(function (a, b) { return a.bc.t - b.bc.t; });
  const atendidos = comBalcao('T').sort(function (a, b) { return b.bc.t - a.bc.t; });
  const d = new Date();
  const vaga = function (v) { return v.curso + ' · ' + Regra.textoDaVaga(v.cota, v.ch.o); };
  trocarFilhos(painel,
    el('div', { class: 'ch-topo' }, el('h2', { text: 'Balcão' }),
      el('span', { class: 'ch-gravacao', id: 'bl-hora', text: 'Atualizado às ' + doisDigitos(d.getHours()) + ':' + doisDigitos(d.getMinutes()) + ':' + doisDigitos(d.getSeconds()) + ' (sozinho, a cada poucos segundos)' }),
      el('button', { class: 'botao pequeno', type: 'button', id: 'bl-fechar', text: 'Fechar', onclick: fecharBalcao })),
    el('div', { class: 'bl-corpo' },
      el('section', { class: 'ch-bloco', id: 'bl-proximos' }, el('h3', {}, 'Próximos', el('small', { text: fila.length ? fila.length + ' na fila' : '' })),
        fila.length ? el('ol', { class: 'bl-lista' }, fila.map(function (v, i) {
          return el('li', { 'data-insc': v.insc }, el('span', { class: 'bl-n', text: String(i + 1) }),
            el('span', {}, el('span', { class: 'ch-n', text: v.nome }),
              el('span', { class: 'ch-m', text: vaga(v) + ' · ' + (v.bc && v.bc.e === 'D' ? 'devolvido à fila às ' + soHora(v.bc.em) : 'confirmado às ' + soHora(v.ch.em)) }),
              el('span', { class: 'bl-docs', text: 'Cobrar: ' + (docsACobrar(v) || 'nada pendente') })));
        })) : el('p', { class: 'ch-vazio', text: 'Ninguém esperando.' })),
      el('div', {},
        el('section', { class: 'ch-bloco', id: 'bl-atendendo' }, el('h3', {}, 'Em atendimento', el('small', { text: atendendo.length ? String(atendendo.length) : '' })),
          atendendo.length ? el('ul', { class: 'bl-lista' }, atendendo.map(function (v) {
            return el('li', { 'data-insc': v.insc }, el('span', { class: 'bl-n', text: '' }),
              el('span', {}, el('span', { class: 'ch-n', text: v.nome }), el('span', { class: 'ch-m', text: 'com ' + v.bc.por + ', desde ' + soHora(v.bc.em) + ' · ' + vaga(v) })));
          })) : el('p', { class: 'ch-vazio', text: 'Ninguém em atendimento.' })),
        el('section', { class: 'ch-bloco', id: 'bl-atendidos' }, el('h3', {}, 'Atendidos', el('small', { text: String(atendidos.length) })),
          atendidos.length ? el('ul', { class: 'bl-lista' }, atendidos.slice(0, 3).map(function (v) {
            return el('li', { 'data-insc': v.insc }, el('span', { class: 'bl-n', text: '' }),
              el('span', {}, el('span', { class: 'ch-n', text: v.nome }), el('span', { class: 'ch-m', text: 'por ' + v.bc.por + ', às ' + soHora(v.bc.em) + (v.situacao ? ' · ' + v.situacao : '') })));
          })) : el('p', { class: 'ch-vazio', text: 'Ninguém atendido ainda.' }),
          atendidos.length > 3 ? el('p', { class: 'ch-vazio', text: 'e mais ' + (atendidos.length - 3) + ' antes.' }) : null))));
}

partida();
})();
</script>
